import java.util.Properties

plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing-private/signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'io.github.yylsping.bilipartfix'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.yylsping.bilipartfix'
        minSdk 27
        targetSdk 35
        versionCode 8
        versionName '1.5.0'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingPropertiesFile.isFile() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
