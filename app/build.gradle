plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bilipartfix'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bilipartfix'
        minSdk 27
        targetSdk 35
        versionCode 6
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
